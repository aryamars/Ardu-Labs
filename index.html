<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - ARDU-LABS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="min-h-screen gradient-bg flex items-center justify-center p-4">
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden"
      >
        <div class="h-2 bg-gradient-to-r from-blue-500 to-indigo-600"></div>
        <div class="p-8">
          <div class="text-center mb-8">
            <div
              class="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-3xl shadow-lg"
            >
              🔌
            </div>
            <h1 class="text-2xl font-bold text-gray-800">ARDU-LABS</h1>
            <p class="text-gray-500 text-sm mt-1">
              Platform Belajar Mikrokontroler Arduino Uno
            </p>
          </div>
          <form onsubmit="handleLogin(event)" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Username</label
              ><input
                type="text"
                required
                class="field field-lg"
                placeholder="Contoh: aryawangi"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Password</label
              ><input
                type="password"
                required
                class="field field-lg"
                placeholder="••••••••"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md transition"
            >
              Masuk
            </button>
          </form>
          <p class="mt-6 text-center text-xs text-gray-400">
            Akun dibuat oleh administrator. Hubungi guru jika belum memiliki
            akun.
          </p>
          <p class="mt-2 text-center text-xs text-gray-300">
            Demo: username berawalan guru, admin, atau kontrol; selain itu masuk
            sebagai siswa eksperimen.
          </p>
        </div>
      </div>
    </div>
    <script src="assets/js/script.js"></script>
  </body>
</html>
