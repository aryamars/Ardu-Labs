<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nilai - ARDU-LABS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: Poppins, sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="flex min-h-screen">
      <div id="sidebar" data-active="nilai"></div>
      <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">
          Nilai dan umpan balik
        </h1>
        <div class="bg-white rounded-xl shadow overflow-hidden max-w-3xl">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-left text-gray-500">
              <tr>
                <th class="p-3">Komponen</th>
                <th class="p-3">Jenis</th>
                <th class="p-3">Nilai</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <tr>
                <td class="p-3">Pretest</td>
                <td class="p-3">Kuis</td>
                <td class="p-3">60</td>
              </tr>
              <tr>
                <td class="p-3">Kuis Pertemuan 4</td>
                <td class="p-3">Kuis formatif</td>
                <td class="p-3">85</td>
              </tr>
              <tr>
                <td class="p-3">Lampu LED Berkedip</td>
                <td class="p-3">Proyek</td>
                <td class="p-3">90</td>
              </tr>
              <tr>
                <td class="p-3">Posttest</td>
                <td class="p-3">Kuis</td>
                <td class="p-3 text-gray-400">Belum tersedia</td>
              </tr>
              <tr class="bg-blue-50 font-semibold">
                <td class="p-3" colspan="2">Nilai akhir</td>
                <td class="p-3 text-gray-400">Belum tersedia</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="bg-white rounded-xl shadow p-5 mt-6 max-w-3xl">
          <h2 class="font-bold mb-2">Umpan balik: Lampu LED Berkedip</h2>
          <p class="text-sm text-gray-600">
            Rangkaian sudah benar. Tambahkan resistor agar LED lebih awet.
          </p>
          <p class="text-xs text-gray-400 mt-2">Guru: Bapak Wahyu</p>
        </div>
      </main>
    </div>
    <script src="../assets/js/script.js"></script>
  </body>
</html>
